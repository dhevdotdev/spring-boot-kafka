# Shared local infrastructure for the demo.
#
# Brought up automatically by spring-boot-docker-compose when either service
# starts (lifecycle-management=start-only, so it's never torn down from under
# the other service). You can also run it by hand:
#
#   docker compose --profile order --profile inventory up -d
#
# Kafka runs in KRaft mode — no ZooKeeper. Two listeners: PLAINTEXT on
# localhost:9092 for apps running on the host (via ./mvnw), and INTERNAL on
# kafka:19092 for other containers (Kafka-UI) on the compose network.
name: kafka-microservices-demo

services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Web UI for browsing topics, messages, consumer groups and lag.
  # http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  # Modern web UI for both Postgres databases. http://localhost:8091
  # Both connections are pre-wired below, so they show up in the sidebar with no
  # login step — just click "orderdb" or "inventorydb".
  dbgate:
    image: dbgate/dbgate:latest
    ports:
      - "8091:3000"
    environment:
      CONNECTIONS: order,inventory
      LABEL_order: orderdb
      SERVER_order: postgres-order
      USER_order: order
      PASSWORD_order: order
      PORT_order: 5432
      DATABASE_order: orderdb
      ENGINE_order: postgres@dbgate-plugin-postgres
      LABEL_inventory: inventorydb
      SERVER_inventory: postgres-inventory
      USER_inventory: inventory
      PASSWORD_inventory: inventory
      PORT_inventory: 5432
      DATABASE_inventory: inventorydb
      ENGINE_inventory: postgres@dbgate-plugin-postgres

  # order-service's database (selected by the "order" Compose profile).
  postgres-order:
    image: postgres:18-alpine
    profiles: ["order"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order

  # inventory-service's database (selected by the "inventory" Compose profile).
  postgres-inventory:
    image: postgres:18-alpine
    profiles: ["inventory"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
