spring.application.name=order-service
server.port=8081

# --- Database: order-service owns its own schema, "orderdb" ----------------
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=order
spring.datasource.password=order
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Docker Compose (dev only) ---------------------------------------------
# Start the shared compose.yaml when the app boots; "start-only" means it is
# never torn down from under the other service. Postgres is auto-wired by
# Compose; Kafka is not (see README 9.7), so we set bootstrap-servers below.
# The "order" profile selects this service's database container.
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.profiles.active=order

# --- Kafka -----------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
# Payloads are plain JSON strings, so both ends use String serdes.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Strongest producer guarantees: wait for all in-sync replicas, no duplicates on retry.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Emit observations so a trace id flows across the Kafka hop.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# --- Observability ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,kafka
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# How often the outbox poller publishes staged events.
app.outbox.poll-delay-ms=1000
